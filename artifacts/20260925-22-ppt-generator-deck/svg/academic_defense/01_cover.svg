<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- 背景（spec VI.1：白底） -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- 顶部深蓝主横条 + 左侧红色竖条（spec V 装饰元素） -->
  <rect x="0" y="0" width="1280" height="100" fill="#003366"/>
  <rect x="0" y="0" width="6" height="100" fill="#CC0000"/>

  <!-- 右上角 Logo 区（spec VI.1） -->
  <rect x="1080" y="25" width="160" height="50" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.3" rx="4"/>
  <text x="1160" y="58" text-anchor="middle" fill="#FFFFFF" font-family="'Microsoft YaHei', '微软雅黑', Arial, sans-serif" font-size="18" font-weight="bold">SKILL LAB</text>

  <!-- 主标题 H1 56px -->
  <text x="640" y="340" text-anchor="middle" fill="#003366" font-family="'Microsoft YaHei', '微软雅黑', Arial, sans-serif" font-size="56" font-weight="bold">前端 Skill 验证实验室</text>

  <!-- 副标题 28px -->
  <text x="640" y="410" text-anchor="middle" fill="#666666" font-family="'Microsoft YaHei', '微软雅黑', Arial, sans-serif" font-size="28">每小时一轮 · 页面构建技能横评阶段汇报</text>

  <!-- 装饰分割线：蓝线 + 圆点（spec VI.1） -->
  <line x1="420" y1="450" x2="860" y2="450" stroke="#0066CC" stroke-width="2"/>
  <circle cx="640" cy="450" r="5" fill="#0066CC"/>

  <!-- 汇报人信息区 -->
  <text x="640" y="520" text-anchor="middle" fill="#333333" font-family="'Microsoft YaHei', '微软雅黑', Arial, sans-serif" font-size="24">汇报人：Qoder Agent（无人值守）</text>
  <text x="640" y="560" text-anchor="middle" fill="#666666" font-family="'Microsoft YaHei', '微软雅黑', Arial, sans-serif" font-size="20">审阅人：项目发起人 sunc-Q</text>
  <text x="640" y="600" text-anchor="middle" fill="#666666" font-family="'Microsoft YaHei', '微软雅黑', Arial, sans-serif" font-size="18">前端页面 Skill 验证实验室 · 第 9 轮</text>

  <!-- 底部信息条 -->
  <rect x="0" y="665" width="1280" height="55" fill="#F5F7FA"/>
  <text x="640" y="698" text-anchor="middle" fill="#999999" font-family="'Microsoft YaHei', '微软雅黑', Arial, sans-serif" font-size="14">2026-09-25 22:00 · 汇报时长约 10 分钟 · 共 5 页</text>
</svg>
