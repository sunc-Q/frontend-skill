<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- 全屏深蓝（spec VI.3：章节页用整页深蓝做过渡） -->
  <rect width="1280" height="720" fill="#003366"/>
  <polygon points="800,0 1280,0 1280,720 600,720" fill="#004080" fill-opacity="0.3"/>
  <rect x="1200" y="0" width="80" height="720" fill="#002244" fill-opacity="0.2"/>

  <!-- 左侧红色竖条装饰 -->
  <rect x="0" y="240" width="12" height="240" fill="#CC0000"/>

  <!-- 大号半透明章节水印 -->
  <text x="120" y="480" fill="#FFFFFF" fill-opacity="0.08" font-family="'Microsoft YaHei', '微软雅黑', Arial, sans-serif" font-size="280" font-weight="bold">02</text>

  <!-- 红色短装饰线（spec VI.3：Red decorative horizontal line） -->
  <line x1="380" y1="265" x2="500" y2="265" stroke="#CC0000" stroke-width="6"/>

  <!-- 章节标题 H3 56px 白 -->
  <text x="380" y="340" fill="#FFFFFF" font-family="'Microsoft YaHei', '微软雅黑', Arial, sans-serif" font-size="56" font-weight="bold">已试组合与留用判定</text>

  <!-- 章节描述（浅蓝灰 #E8F4FC） -->
  <text x="380" y="410" fill="#E8F4FC" font-family="'Microsoft YaHei', '微软雅黑', Arial, sans-serif" font-size="24">4 个技能 × 8 个场景 · 逐轮留用判定</text>

  <text x="380" y="470" fill="#FFFFFF" fill-opacity="0.6" font-family="'Microsoft YaHei', '微软雅黑', Arial, sans-serif" font-size="16">判定口径：留用 / 留用（限定场景）/ 不适用条款逐条记因</text>

  <!-- 底部右侧标注本页来源 -->
  <text x="1240" y="680" text-anchor="end" fill="#FFFFFF" fill-opacity="0.4" font-family="'Microsoft YaHei', '微软雅黑', Arial, sans-serif" font-size="18">前端 Skill 验证实验室 · 8 轮记录</text>
</svg>
