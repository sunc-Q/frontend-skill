<!doctype html>
<html lang="zh-CN" data-theme="memphis">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>拾光 Shiguang · 端侧相册整理 · 孟菲斯</title>
<style>
/* ============================================================
   结构层：只描述布局、间距、字号与状态类。
   所有颜色/字体/圆角/阴影一律走自定义属性，由主题层覆盖。
   内联时本文件在前、主题文件在后 —— 顺序即层叠优先级。
   ============================================================ */

*,
*::before,
*::after {
  box-sizing: border-box;
}

:root {
  --bg: #fafafa;
  --bg-2: #ffffff;
  --panel: #ffffff;
  --ink: #1a1a1a;
  --ink-2: #3d3d3d;
  --muted: #767676;
  --line: #e2e2e2;
  --accent: #2f5dbf;
  --accent-ink: #ffffff;
  --accent-2: #9aa7bd;
  --radius: 8px;
  --radius-sm: 4px;
  --border-w: 1px;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  --sec-pad: 88px;
  --gap: 24px;
  --maxw: 1120px;
  --nav-h: 64px;
  --font-body: system-ui, sans-serif;
  --font-display: var(--font-body);
  --font-mono: ui-monospace, monospace;
  --cell-h: 74px;
  --bad: #b4453a;
  --title-size: 34px;
  --hero-size: 52px;
  --track: 0em;
  color-scheme: light;
}

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.7;
  letter-spacing: var(--track);
}

#root {
  min-height: 100vh;
}

.page {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 24px;
}

h1,
h2,
h3,
p,
dl,
dd,
figure,
blockquote {
  margin: 0;
}

button {
  font: inherit;
  color: inherit;
  letter-spacing: inherit;
}

input {
  font: inherit;
}

ul,
ol {
  margin: 0;
  padding: 0;
  list-style: none;
}

/* ---------- 顶栏 ---------- */
.nav {
  position: sticky;
  top: 0;
  z-index: 30;
  height: var(--nav-h);
  background: var(--nav-bg, var(--bg));
  border-bottom: var(--border-w) solid var(--line);
}

.nav--lift {
  box-shadow: var(--shadow);
}

.nav-in {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 24px;
  height: var(--nav-h);
  display: flex;
  align-items: center;
  gap: 20px;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--ink);
  text-decoration: none;
  font-family: var(--font-display);
  font-weight: 700;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-left: auto;
}

.nav-link {
  display: inline-block;
  padding: 6px 10px;
  color: var(--muted);
  text-decoration: none;
  border-radius: var(--radius-sm);
}

.nav-link:hover {
  color: var(--ink);
}

.nav-link--on {
  color: var(--accent);
  background: var(--nav-on-bg, transparent);
}

.nav-right {
  display: inline-flex;
  align-items: center;
  gap: 12px;
}

.nav-theme {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--muted);
}

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 20px;
  border-radius: var(--radius);
  border: var(--border-w) solid transparent;
  text-decoration: none;
  cursor: pointer;
  font-weight: 600;
}

.btn--primary {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
}

.btn--ghost {
  background: transparent;
  color: var(--ink);
  border-color: var(--line);
}

.btn--sm {
  padding: 7px 12px;
  font-size: 13px;
}

.btn:disabled {
  cursor: default;
  opacity: 0.6;
}

/* ---------- hero ---------- */
.hero {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
  gap: calc(var(--gap) * 2);
  align-items: center;
  padding: calc(var(--sec-pad) * 0.7) 0 var(--sec-pad);
}

.eyebrow {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 18px;
}

.hero-title {
  font-family: var(--font-display);
  font-size: var(--hero-size);
  line-height: 1.18;
  font-weight: 700;
  margin-bottom: 22px;
}

.hero-break {
  display: block;
}

.hero-lead {
  color: var(--ink-2);
  max-width: 46ch;
  margin-bottom: 28px;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 22px;
}

.hero-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  font-size: 12.5px;
  color: var(--muted);
}

.hero-badges li {
  padding: 3px 9px;
  border: var(--border-w) solid var(--line);
  border-radius: 999px;
}

.hero-visual {
  position: relative;
  padding: var(--gap);
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius);
  background: var(--bg-2);
  overflow: hidden;
}

.stack-photos {
  display: grid;
  gap: 10px;
  margin-bottom: 18px;
}

.ph {
  display: block;
  padding: 14px 16px;
  border-radius: var(--radius-sm);
  background: var(--panel);
  border: var(--border-w) solid var(--line);
  font-family: var(--font-mono);
  font-size: 12.5px;
  color: var(--muted);
}

.arrow {
  height: 26px;
  margin: 0 auto 18px;
  width: 2px;
  background: var(--accent-2);
}

.organised {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.grp {
  padding: 12px;
  border-radius: var(--radius-sm);
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 13px;
  text-align: center;
  opacity: 0.92;
}

/* ---------- 通用分区 ---------- */
.section {
  padding: var(--sec-pad) 0;
  border-top: var(--border-w) solid var(--line);
}

.section-title {
  font-family: var(--font-display);
  font-size: var(--title-size);
  font-weight: 700;
  margin-bottom: 28px;
}

.sec-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 24px;
}

.sec-head .section-title {
  margin-bottom: 0;
}

/* ---------- 能力卡 ---------- */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: var(--gap);
}

.card {
  padding: 22px;
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
}

.card-icon {
  display: inline-flex;
  padding: 9px;
  margin-bottom: 14px;
  border-radius: var(--radius-sm);
  color: var(--accent);
  background: var(--icon-bg, var(--bg));
}

.card h3 {
  font-family: var(--font-display);
  font-size: 18px;
  margin-bottom: 8px;
}

.card p {
  color: var(--ink-2);
  font-size: 14.5px;
}

/* ---------- 步骤与统计 ---------- */
.steps {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: var(--gap);
  counter-reset: st;
}

.step {
  padding: 20px;
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
}

.step-n {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--accent);
  margin-bottom: 10px;
}

.step h3 {
  font-size: 16px;
  font-family: var(--font-display);
  margin-bottom: 6px;
}

.step p {
  font-size: 14px;
  color: var(--ink-2);
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 1px;
  margin-top: var(--gap);
  background: var(--line);
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}

.stat {
  display: grid;
  grid-template-columns: auto auto;
  align-items: baseline;
  gap: 2px 4px;
  padding: 18px;
  background: var(--panel);
}

.stat-v {
  font-family: var(--font-display);
  font-size: 30px;
  line-height: 1;
}

.stat-u {
  font-size: 12px;
  color: var(--muted);
}

.stat-k {
  grid-column: 1 / -1;
  font-size: 12.5px;
  color: var(--muted);
}

/* ---------- 相册墙演示 ---------- */
.wall-head {
  margin-bottom: 20px;
}

.wall-note {
  color: var(--ink-2);
  font-size: 14.5px;
  max-width: 62ch;
}

.wall-tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  margin: 18px 0;
}

.seg {
  display: inline-flex;
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}

.seg-b {
  padding: 8px 16px;
  background: var(--panel);
  border: 0;
  cursor: pointer;
  font-size: 14px;
}

.seg-b--on {
  background: var(--accent);
  color: var(--accent-ink);
}

.wall-pending {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--muted);
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 11px;
  font-size: 13px;
  border-radius: 999px;
  border: var(--border-w) solid var(--line);
  background: var(--panel);
  cursor: pointer;
}

.chip:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.chip--on {
  border-color: var(--accent);
  color: var(--accent);
}

.chip-n {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
}

.wall {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
  gap: 6px;
  /* rendering-content-visibility: 长列表离屏部分跳过渲染 */
  content-visibility: auto;
  contain-intrinsic-size: auto 420px;
}

.cell {
  height: var(--cell-h);
  border-radius: var(--radius-sm);
  background: hsl(var(--h) 34% 72%);
  border: var(--border-w) solid var(--line);
}

.cell--wide {
  grid-column: span 2;
}

.cell--blur {
  filter: blur(1.5px);
}

.cell--screenshot {
  background: hsl(var(--h) 8% 80%);
}

.cell--event {
  background: hsl(var(--h) 44% 62%);
}

.albums {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: var(--gap);
}

.album {
  display: grid;
  grid-template-columns: 44px 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 14px;
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
}

.album-cover {
  width: 44px;
  height: 44px;
  border-radius: var(--radius-sm);
  background: hsl(var(--h) 40% 60%);
}

.album-name {
  font-size: 14.5px;
}

.album-n {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--muted);
}

.wall-hint {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 14px;
  font-size: 12.5px;
  color: var(--muted);
}

/* ---------- 使用者 ---------- */
.voices {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: var(--gap);
}

.voice {
  display: grid;
  gap: 16px;
  align-content: start;
  padding: 22px;
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
}

.voice blockquote {
  font-size: 14.5px;
  color: var(--ink-2);
}

.voice figcaption {
  display: flex;
  align-items: center;
  gap: 10px;
}

.voice-avatar {
  display: inline-grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: var(--radius-sm);
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 14px;
}

.voice-meta {
  display: grid;
  margin-right: auto;
}

.voice-name {
  font-size: 14px;
}

.voice-role {
  font-size: 12px;
  color: var(--muted);
}

.voice-photos {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--muted);
}

.empty {
  padding: 20px;
  border: var(--border-w) dashed var(--line);
  border-radius: var(--radius);
  color: var(--muted);
  font-size: 14px;
}

/* ---------- 问答 ---------- */
.search {
  display: flex;
  align-items: center;
  gap: 10px;
}

.search-i {
  padding: 9px 12px;
  min-width: 220px;
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  color: var(--ink);
}

.search-n,
.search-stale {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--muted);
}

.faqs {
  display: grid;
  gap: 0;
  border-top: var(--border-w) solid var(--line);
}

.faq {
  border-bottom: var(--border-w) solid var(--line);
}

.faq-q {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  width: 100%;
  padding: 16px 4px;
  background: transparent;
  border: 0;
  text-align: left;
  cursor: pointer;
  font-size: 15.5px;
}

.faq-mark {
  font-family: var(--font-mono);
  color: var(--accent);
}

.faq-a {
  display: none;
  padding: 0 4px 18px;
  font-size: 14.5px;
  color: var(--ink-2);
  max-width: 74ch;
}

.faq--on .faq-a {
  display: block;
}

/* ---------- 定价与表单 ---------- */
.plans {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: var(--gap);
  margin-bottom: var(--gap);
}

.plan {
  position: relative;
  display: grid;
  gap: 4px;
  align-content: start;
  padding: 22px;
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  cursor: pointer;
}

.plan--on {
  border-color: var(--accent);
  box-shadow: var(--shadow);
}

.plan-radio {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.plan-name {
  font-family: var(--font-display);
  font-size: 15px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.plan-badge {
  position: absolute;
  top: -10px;
  right: 16px;
  padding: 2px 8px;
  font-size: 11px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--accent-ink);
}

.plan-p {
  font-family: var(--font-display);
  font-size: 30px;
}

.plan-u {
  font-size: 12px;
  color: var(--muted);
  margin-left: 6px;
}

.plan-limit {
  font-size: 12.5px;
  color: var(--muted);
  margin-bottom: 10px;
}

.plan-lines {
  display: grid;
  gap: 6px;
  font-size: 13.5px;
  color: var(--ink-2);
}

.plan-lines li {
  display: flex;
  align-items: flex-start;
  gap: 6px;
}

.plan-lines svg {
  flex: 0 0 auto;
  margin-top: 4px;
  color: var(--accent);
}

.cta-form {
  display: grid;
  gap: 18px;
  padding: 22px;
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius);
  background: var(--bg-2);
}

.platforms {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding: 0;
  margin: 0;
  border: 0;
}

.platforms legend {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
}

.platform {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  font-size: 13.5px;
  border: var(--border-w) solid var(--line);
  border-radius: 999px;
  background: var(--panel);
  cursor: pointer;
}

.platform--on {
  border-color: var(--accent);
  color: var(--accent);
}

.platform input {
  accent-color: var(--accent);
}

.field {
  display: grid;
  gap: 6px;
  max-width: 420px;
}

.field-label {
  font-size: 13px;
  color: var(--muted);
}

.field-i {
  padding: 10px 12px;
  border: var(--border-w) solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--panel);
  color: var(--ink);
}

.field-i--bad {
  border-color: var(--bad);
}

.field-hint {
  font-size: 12px;
  color: var(--muted);
}

.cta-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
}

.cta-flags {
  display: flex;
  gap: 12px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--muted);
}

/* ---------- 页脚与提示 ---------- */
.foot {
  padding: 40px 0 64px;
  border-top: var(--border-w) solid var(--line);
  font-size: 12.5px;
  color: var(--muted);
}

.foot-theme {
  margin-bottom: 6px;
  font-family: var(--font-mono);
}

.foot code {
  font-family: var(--font-mono);
}

.toasts {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 60;
  display: grid;
  gap: 8px;
  max-width: 320px;
}

.toast {
  padding: 11px 14px;
  border-radius: var(--radius);
  background: var(--ink);
  color: var(--bg);
  font-size: 13px;
  box-shadow: var(--shadow);
}

/* 进场动画只做加法：元素即使没被 observer 捕捉到也保持可见 */
[data-reveal] {
  opacity: 1;
}

.is-in {
  animation: rise 0.45s ease-out both;
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@media (max-width: 900px) {
  .hero {
    grid-template-columns: minmax(0, 1fr);
  }

  .nav-links {
    display: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  .is-in {
    animation: none;
  }
}

/* ============================================================
   主题三：孟菲斯 memphis
   主张：奶油底 + 波点/斜纹纹理，青绿与品红撞色，粗黑虚线描边，
   圆角忽大忽小（贴纸感），块面歪 2–3 度，指针位置是一颗漂浮糖果。
   ============================================================ */

:root[data-theme='memphis'] {
  --bg: #fdf6e8;
  --bg-2: #fffdf7;
  --panel: #ffffff;
  --ink: #221d2e;
  --ink-2: #3a3350;
  --muted: #7a7291;
  --line: #221d2e;
  --accent: #ff5fa2;
  --accent-ink: #221d2e;
  --accent-2: #23bfb1;
  --radius: 20px;
  --radius-sm: 3px;
  --border-w: 2px;
  --shadow: 6px 6px 0 #23bfb1;
  --sec-pad: 84px;
  --gap: 20px;
  --maxw: 1160px;
  --nav-bg: #fdf6e8;
  --nav-on-bg: #ffd447;
  --icon-bg: #ffd447;
  --cell-h: 84px;
  --title-size: 40px;
  --hero-size: 58px;
  --track: 0em;
  --font-body: 'PingFang SC', 'Trebuchet MS', 'Hiragino Sans GB', sans-serif;
  --font-display: 'Trebuchet MS', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
  --font-mono: 'Menlo', monospace;
}

:root[data-theme='memphis'] body {
  background-image: radial-gradient(#221d2e1a 1.2px, transparent 1.3px),
    repeating-linear-gradient(135deg, #23bfb114 0 6px, transparent 6px 18px);
  background-size: 22px 22px, auto;
}

:root[data-theme='memphis'] .nav {
  border-bottom: 3px dashed #221d2e;
}

:root[data-theme='memphis'] .brand {
  font-family: 'Trebuchet MS', sans-serif;
  font-size: 19px;
  letter-spacing: -0.02em;
}

:root[data-theme='memphis'] .brand svg {
  color: #ff5fa2;
  transform: rotate(-8deg);
}

:root[data-theme='memphis'] .nav-link {
  font-weight: 700;
  border-radius: 12px 3px 12px 3px;
}

:root[data-theme='memphis'] .nav-link--on {
  background: #ffd447;
  color: #221d2e;
  border: 2px solid #221d2e;
}

:root[data-theme='memphis'] .nav-theme {
  color: #ff5fa2;
  font-weight: 700;
}

:root[data-theme='memphis'] .hero {
  grid-template-columns: minmax(0, 1fr) minmax(0, 0.9fr);
  gap: 34px;
  padding: 74px 0 92px;
}

:root[data-theme='memphis'] .hero-title {
  font-weight: 800;
  line-height: 1.06;
  letter-spacing: -0.02em;
}

:root[data-theme='memphis'] .hero-title em {
  font-style: normal;
  display: inline-block;
  background: #23bfb1;
  color: #221d2e;
  padding: 2px 12px;
  border-radius: 22px 4px 22px 4px;
  transform: rotate(-1.6deg);
}

:root[data-theme='memphis'] .eyebrow {
  display: inline-block;
  color: #221d2e;
  background: #fff;
  border: 2px solid #221d2e;
  border-radius: 999px;
  padding: 4px 12px;
  text-transform: none;
  letter-spacing: 0.02em;
}

:root[data-theme='memphis'] .hero-visual {
  border: 3px solid #221d2e;
  border-radius: 26px 8px 26px 8px;
  background-color: #fff;
  background-image: radial-gradient(#221d2e26 1.4px, transparent 1.5px);
  background-size: 16px 16px;
  box-shadow: 8px 8px 0 #ff5fa2;
  transform: rotate(1.4deg);
}

/* 指针 = 一颗跟着走的糖果 */
:root[data-theme='memphis'] .hero-visual::after {
  content: '';
  position: absolute;
  left: var(--px, 55%);
  top: var(--py, 45%);
  width: 54px;
  height: 54px;
  margin: -27px 0 0 -27px;
  border: 3px solid #221d2e;
  border-radius: 50% 12% 50% 12%;
  background: #ffd447;
  box-shadow: 4px 4px 0 #23bfb1;
}

:root[data-theme='memphis'] .ph {
  border: 2px dashed #221d2e;
  border-radius: 14px 4px 14px 4px;
  background: #fff8ea;
  color: #221d2e;
  font-family: 'Trebuchet MS', sans-serif;
}

:root[data-theme='memphis'] .ph--2 {
  transform: rotate(-1.2deg);
}

:root[data-theme='memphis'] .ph--3 {
  transform: rotate(1.1deg);
}

:root[data-theme='memphis'] .arrow {
  background: repeating-linear-gradient(180deg, #221d2e 0 6px, transparent 6px 12px);
  width: 4px;
}

:root[data-theme='memphis'] .grp {
  border: 2px solid #221d2e;
  border-radius: 18px 5px 18px 5px;
  font-weight: 700;
}

:root[data-theme='memphis'] .grp:nth-child(2) {
  background: #23bfb1;
}

:root[data-theme='memphis'] .grp:nth-child(3) {
  background: #ffd447;
  color: #221d2e;
}

:root[data-theme='memphis'] .section {
  border-top: 3px dashed #221d2e;
}

:root[data-theme='memphis'] .section-title {
  display: inline-block;
  font-weight: 800;
  border-bottom: 8px solid #ffd447;
  transform: rotate(-0.8deg);
}

:root[data-theme='memphis'] .card {
  border: 3px solid #221d2e;
  border-radius: 22px 6px 22px 6px;
  box-shadow: 6px 6px 0 #23bfb1;
}

:root[data-theme='memphis'] .card:nth-child(2) {
  border-radius: 6px 22px 6px 22px;
  box-shadow: 6px 6px 0 #ff5fa2;
  transform: rotate(0.9deg);
}

:root[data-theme='memphis'] .card:nth-child(3) {
  box-shadow: 6px 6px 0 #ffd447;
  transform: rotate(-1deg);
}

:root[data-theme='memphis'] .card-icon {
  border: 2px solid #221d2e;
  border-radius: 50% 16% 50% 16%;
  color: #221d2e;
}

:root[data-theme='memphis'] .step {
  border: 3px solid #221d2e;
  border-radius: 8px;
  box-shadow: 5px 5px 0 #221d2e;
  background: #fff8ea;
}

:root[data-theme='memphis'] .step-n {
  display: inline-grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: #ff5fa2;
  color: #fff;
  font-family: 'Trebuchet MS', sans-serif;
  font-size: 14px;
  font-weight: 800;
}

:root[data-theme='memphis'] .stats {
  background: #221d2e;
  border: 3px solid #221d2e;
  border-radius: 24px 8px 24px 8px;
  gap: 3px;
}

:root[data-theme='memphis'] .stat {
  background: #fdf6e8;
}

:root[data-theme='memphis'] .stat-v {
  font-family: 'Trebuchet MS', sans-serif;
  font-weight: 800;
  font-size: 38px;
  color: #ff5fa2;
}

:root[data-theme='memphis'] .btn {
  border: 3px solid #221d2e;
  border-radius: 999px;
  font-weight: 800;
  box-shadow: 4px 4px 0 #221d2e;
}

:root[data-theme='memphis'] .btn--primary {
  background: #ff5fa2;
  color: #221d2e;
}

:root[data-theme='memphis'] .btn--ghost {
  background: #fff;
  border-color: #221d2e;
}

:root[data-theme='memphis'] .cell {
  border: 2px solid #221d2e;
  border-radius: 12px 3px 12px 3px;
  background: hsl(var(--h) 62% 68%);
}

:root[data-theme='memphis'] .cell--wide {
  border-radius: 3px 14px 3px 14px;
}

:root[data-theme='memphis'] .albums,
:root[data-theme='memphis'] .wall {
  gap: 10px;
}

:root[data-theme='memphis'] .album {
  border: 3px solid #221d2e;
  border-radius: 18px 6px 18px 6px;
  box-shadow: 5px 5px 0 #ffd447;
}

:root[data-theme='memphis'] .album-cover {
  border: 2px solid #221d2e;
  border-radius: 50% 14% 50% 14%;
}

:root[data-theme='memphis'] .seg {
  border: 3px solid #221d2e;
  border-radius: 999px;
  background: #fff;
}

:root[data-theme='memphis'] .seg-b {
  font-weight: 700;
  background: transparent;
}

:root[data-theme='memphis'] .seg-b--on {
  background: #23bfb1;
  color: #221d2e;
}

:root[data-theme='memphis'] .chip,
:root[data-theme='memphis'] .platform {
  border: 2px solid #221d2e;
  border-radius: 999px;
  background: #fff;
  font-weight: 700;
}

:root[data-theme='memphis'] .chip--on,
:root[data-theme='memphis'] .platform--on {
  background: #ffd447;
  color: #221d2e;
  box-shadow: 3px 3px 0 #221d2e;
}

:root[data-theme='memphis'] .voice {
  border: 3px solid #221d2e;
  border-radius: 20px;
  background: #fff;
}

:root[data-theme='memphis'] .voice-avatar {
  border: 2px solid #221d2e;
  border-radius: 50%;
  background: #23bfb1;
  color: #221d2e;
  font-weight: 800;
}

:root[data-theme='memphis'] .faq {
  border-bottom: 2px dotted #221d2e;
}

:root[data-theme='memphis'] .faq-q {
  font-weight: 700;
}

:root[data-theme='memphis'] .faq-mark {
  display: inline-grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border: 2px solid #221d2e;
  border-radius: 50%;
  background: #ffd447;
  color: #221d2e;
  font-size: 16px;
}

:root[data-theme='memphis'] .search-i,
:root[data-theme='memphis'] .field-i {
  border: 3px solid #221d2e;
  border-radius: 14px 4px 14px 4px;
  background: #fff;
}

:root[data-theme='memphis'] .plan {
  border: 3px solid #221d2e;
  border-radius: 24px 8px 24px 8px;
  box-shadow: 6px 6px 0 #23bfb1;
}

:root[data-theme='memphis'] .plan--on {
  background: #fff8ea;
  box-shadow: 8px 8px 0 #ff5fa2;
  transform: translateY(-4px);
}

:root[data-theme='memphis'] .plan-p {
  font-family: 'Trebuchet MS', sans-serif;
  font-weight: 800;
  color: #ff5fa2;
}

:root[data-theme='memphis'] .cta-form {
  border: 3px dashed #221d2e;
  border-radius: 26px;
  background: #fff;
}

:root[data-theme='memphis'] .toast {
  border: 2px solid #221d2e;
  border-radius: 14px 4px 14px 4px;
  background: #ffd447;
  color: #221d2e;
  box-shadow: 4px 4px 0 #221d2e;
}

:root[data-theme='memphis'] .foot {
  border-top: 3px dashed #221d2e;
}
